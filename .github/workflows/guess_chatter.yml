name: Guess Chatter

on:
  schedule:
    - cron: "0,20,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guess-chatter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install discord.py

      - name: Run Guess Chatter
        run: python guess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
