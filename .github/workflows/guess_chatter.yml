name: Guess Chatter

on:
  schedule:
    - cron: "0,20,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  guess-chatter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests

      - name: Run Guess Chatter
        run: python guess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_ACTION_TOKEN: ${{ github.token }}
