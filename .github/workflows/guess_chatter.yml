name: Guess the Chatter

on:
  schedule:
    - cron: "7 0,6,12,18 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guess-the-chatter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Guess the Chatter
        run: python guess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
