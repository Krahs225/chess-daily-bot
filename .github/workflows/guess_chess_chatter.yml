name: Guess Chess Chatter

on:
  schedule:
    - cron: "10,30,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guess-chess-chatter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests python-chess cairosvg

      - name: Run Guess Chess Chatter
        run: python guess_chess_chatter.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
